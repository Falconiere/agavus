[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agavus"
version = "0.1.0"
description = "Domain-organized Python scaffold (hello world) with strict quality gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "deptry>=0.20", "pre-commit>=4.0"]

[project.scripts]
agavus = "agavus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agavus"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "PL", "RUF"]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
strict = true
files = ["src", "scripts"]
mypy_path = "src:scripts"

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.deptry]
known_first_party = ["agavus", "check_sizes", "check_duplication", "check_commit_msg", "pyutils"]

[tool.deptry.per_rule_ignores]
# CLI tools invoked via Makefile/pre-commit, never imported in code.
DEP002 = ["ruff", "mypy", "deptry", "pre-commit"]