[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agavus"
version = "0.4.0"
description = "CPU-only legal classifier and cited statute search for Brazilian family and domestic-violence law (TJDFT)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.22",
    "python-dotenv>=1.0",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
lab = [
    "torch>=2.7",
]
dev = [
    "torch>=2.7",
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "deptry>=0.20",
    "pre-commit>=4.0",
    "gradio>=6.32.0",
]

[project.scripts]
agavus = "agavus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agavus"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
src = ["src", "scripts", "space"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM", "PL", "RUF"]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
strict = true
files = ["src", "scripts", "space"]
mypy_path = "src:scripts:stubs"

[tool.pytest.ini_options]
testpaths = ["src", "scripts", "space"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.deptry]
known_first_party = [
  "agavus",
  "space",
  "check_sizes",
  "check_duplication",
  "check_commit_msg",
  "check_commit_range",
  "check_staged_data",
  "pyutils",
]

[tool.deptry.per_rule_ignores]
# CLI tools invoked via Makefile/pre-commit, never imported in code.
DEP002 = ["ruff", "mypy", "deptry", "pre-commit"]

# The lab runs on CPU by default; a rented GPU machine installs its own build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
