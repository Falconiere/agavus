name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and eval-gate only, without uploading
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  HF_MODEL_REPO: Falconiere/agavus-classifier
  HF_SPACE_REPO: Falconiere/agavus

jobs:
  release:
    name: Eval-gated release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGAVUS_DATA_DIR: ${{ github.workspace }}/.agavus-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match package version v$version"
            exit 1
          fi
      - name: Quality gates
        run: make check
      - name: Build packages
        run: uv build
      - name: Stage and publish
        if: inputs.dry_run != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run agavus publish --bootstrap space/assets \
            --repo "$HF_MODEL_REPO" \
            --space "$HF_SPACE_REPO" \
            --revision "$GITHUB_REF_NAME"
      - name: Stage only (dry run)
        if: inputs.dry_run == true
        run: uv run agavus publish --bootstrap space/assets
      - name: Collect release assets
        run: |
          cp "$AGAVUS_DATA_DIR/hf-staging/README.md" model-card.md
          cp "$AGAVUS_DATA_DIR/hf-staging/eval_report.json" eval-report.json
          cp "$AGAVUS_DATA_DIR/hf-staging/models.db" models.db
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agavus-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            model-card.md
            eval-report.json
            models.db
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            model-card.md
            eval-report.json
            models.db
