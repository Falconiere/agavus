name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Corpus data never in git (LGPD)
        run: |
          tracked="$(git ls-files data/)"
          if [ -n "$tracked" ]; then
            printf 'tracked corpus data (LGPD violation):\n%s\n' "$tracked"
            exit 1
          fi
      - name: Commit message convention
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run python scripts/check_commit_range.py "$BASE_SHA" "$HEAD_SHA"
      - name: Quality gates
        run: make check
      - name: Offline bootstrap + eval gate
        env:
          AGAVUS_DATA_DIR: ${{ runner.temp }}/agavus-data
        run: uv run agavus publish --bootstrap space/assets
